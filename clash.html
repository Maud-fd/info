<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arène de Clash</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle, #2b0000, #000000);
      color: white;
      text-align: center;
    }
    h1 {
      font-size: 4em;
      color: #ff4f81;
      text-transform: uppercase;
      text-shadow: 0 0 20px #ff4f81, 0 0 40px #ff0000;
      margin-bottom: 10px;
    }
    .versus-container {
      display: flex;
      align-items: center;
      gap: 50px;
      font-size: 3em;
      font-weight: bold;
    }
    .fighter {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px 50px;
      border-radius: 15px;
      border: 2px solid white;
      box-shadow: 0 0 20px rgba(255,255,255,0.5);
    }
    .vs {
      font-size: 1.5em;
      color: #ffcc00;
      text-shadow: 0 0 10px #ffcc00;
      animation: pulse 1s infinite;
    }
    .back-btn {
      margin-top: 50px;
      padding: 15px 30px;
      font-size: 1.2em;
      background: white;
      color: black;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
  </style>
</head>
<body>

  <h1>L'Heure du Clash a sonné !</h1>
  
  <div class="versus-container">
    <div class="fighter" id="fighter1">Joueur 1</div>
    <div class="vs">VS</div>
    <div class="fighter" id="fighter2">Joueur 2</div>
  </div>

  <button class="back-btn" onclick="window.location.href='index.html'">Retour à la base</button>

  <script>
    // Récupérer les noms depuis l'URL (ex: ?p1=Lilian&p2=Maud)
    const urlParams = new URLSearchParams(window.location.search);
    const p1 = urlParams.get('p1') || "Inconnu 1";
    const p2 = urlParams.get('p2') || "Inconnu 2";

    // Afficher les noms
    document.getElementById('fighter1').innerText = p1;
    document.getElementById('fighter2').innerText = p2;
  </script>

</body>
</html>
