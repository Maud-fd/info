<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Team de Choc</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4);
      overflow: hidden;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 40px;
      font-size: 3em;
      animation: bounce 2s infinite;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.4);
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 60px;
      flex-wrap: wrap;
    }

    .card {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 25px;
      width: 220px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: scale(1.1) rotate(3deg);
    }

    .name {
      font-size: 2em;
      margin-bottom: 10px;
    }

    .desc {
      font-size: 1.1em;
    }

    .emoji {
      font-size: 3em;
      margin-bottom: 10px;
      animation: spin 5s linear infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .footer {
      position: absolute;
      bottom: 20px;
      width: 100%;
      font-size: 1.2em;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <h1>🎉 Bienvenue dans la Team Infernalement Drôle 🎉</h1>

  <div class="container">
    <div class="card">
      <div class="emoji">🕺</div>
      <div class="name">Lilian</div>
      <div class="desc">Expert officiel des blagues nulles mais hilarantes.</div>
    </div>

    <div class="card">
      <div class="emoji">😂</div>
      <div class="name">Fanny</div>
      <div class="desc">Rit avant même la fin des blagues.</div>
    </div>

    <div class="card">
      <div class="emoji">🚀</div>
      <div class="name">Maud</div>
      <div class="desc">Toujours prête à transformer une soirée calme en aventure épique.</div>
    </div>
  </div>

  <div class="footer">
    ⚡ Attention : trop de fun peut provoquer des fous rires incontrôlables ⚡
  </div>

  <script>
    const cards = document.querySelectorAll('.card');

    cards.forEach(card => {
      card.addEventListener('click', () => {
        alert('🤣 ' + card.querySelector('.name').innerText + ' vient de déclencher le mode fou rire !');
      });
    });
  </script>

</body>
</html>
